<style>
:root{
  --encre:#14512F;
  --encre-clair:#4E7A62;
  --papier:#FDFAF4;
  --sable:#F3E8D8;
  --sable-fonce:#E2D0B6;
  --or:#E07A1F;
  --or-clair:#FBE6CF;
  --vert:#1E7A4C;
  --vert-clair:#DCEFE2;
  --brique:#B33A1C;
  --brique-clair:#F9E1D9;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--sable);
  color:var(--encre);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:460px;margin:0 auto;background:var(--papier);min-height:100vh;
  box-shadow:0 0 0 1px rgba(20,81,47,.10)}
.pad{padding:22px 20px 28px}

h1,h2,h3,.disp{font-family:Georgia,"Times New Roman",serif;font-weight:normal;letter-spacing:-.01em}
h1{font-size:32px;line-height:1.15;margin:0 0 12px}
h2{font-size:23px;line-height:1.2;margin:0 0 6px}
h3{font-size:18px;margin:0 0 4px}
p{margin:0 0 12px}
small{font-size:13px;line-height:1.45;display:block;color:var(--encre-clair)}

/* ---------- barre haute ---------- */
.bar{background:var(--encre);color:var(--papier);padding:13px 20px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.bar .logo{font-family:Georgia,serif;font-size:17px;letter-spacing:.02em}
.bar .logo b{font-weight:normal;color:var(--or)}
.bar .etat{margin-left:auto;font-size:12px;color:#A9C9B6}
.retour{background:none;border:0;color:var(--papier);font-size:15px;padding:4px 0;cursor:pointer;
  font-family:inherit}

/* ---------- progression ---------- */
.prog{display:flex;gap:4px;padding:14px 20px 0}
.prog i{flex:1;height:3px;background:var(--sable-fonce);border-radius:2px}
.prog i.on{background:var(--or)}
.etape{font-size:12.5px;color:var(--encre-clair);padding:8px 20px 0}

/* ---------- accueil ---------- */
.hero{padding:34px 20px 26px;background:var(--papier);
  background-image:linear-gradient(var(--sable) 1px,transparent 1px);
  background-size:100% 30px;background-position:0 -1px}
.hero h1{margin-bottom:14px}
.hero .lead{font-size:16.5px;color:var(--encre-clair);margin-bottom:22px}
.chiffres{display:flex;gap:10px;margin:22px 0 0;border-top:1px solid var(--sable-fonce);padding-top:16px}
.chiffres div{flex:1}
.chiffres .n{font-family:Georgia,serif;font-size:22px;color:var(--vert)}
.chiffres small{font-size:11.5px}

/* ---------- boutons ---------- */
button{font-family:inherit}
.btn{display:block;width:100%;padding:15px 18px;background:var(--encre);color:var(--papier);
  border:0;border-radius:var(--r);font-size:16px;cursor:pointer;text-align:center;line-height:1.3}
.btn:active{background:#0D3A22}
.btn[disabled]{background:var(--sable-fonce);color:#8D9B8F;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--encre);border:1.5px solid var(--sable-fonce)}
.btn.or{background:var(--or);color:#3A1C02}
.btn.mini{padding:11px 14px;font-size:14.5px;width:auto;display:inline-block}
.duo{display:flex;gap:10px;margin-top:16px}
.duo .btn{flex:1}
button:focus-visible,select:focus-visible,input:focus-visible,.chip:focus-visible{
  outline:3px solid var(--or);outline-offset:2px}

/* ---------- formulaire ---------- */
label.q{display:block;font-size:15px;margin:22px 0 9px;font-weight:600}
label.q span{font-weight:400;color:var(--encre-clair);font-size:13.5px}
select,input[type=number],input[type=text]{
  width:100%;padding:13px 12px;font-size:16px;font-family:inherit;color:var(--encre);
  background:#fff;border:1.5px solid var(--sable-fonce);border-radius:var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 13px;border:1.5px solid var(--sable-fonce);background:#fff;border-radius:999px;
  font-size:14px;cursor:pointer;color:var(--encre)}
.chip[aria-pressed=true]{background:var(--encre);color:var(--papier);border-color:var(--encre)}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.aide{background:var(--or-clair);border-radius:var(--r);padding:12px 14px;margin:18px 0 0}
.aide small{color:#7A3F05}

/* ---------- resultats ---------- */
.fiche{background:#fff;border:1px solid var(--sable-fonce);border-radius:var(--r);
  padding:16px 16px 14px;margin:0 0 12px;border-left:5px solid var(--vert);cursor:pointer;
  text-align:left;width:100%;display:block}
.fiche.moyen{border-left-color:var(--or)}
.fiche.faible{border-left-color:var(--brique)}
.fiche .haut{display:flex;align-items:flex-start;gap:12px}
.fiche .haut h3{flex:1}
.score{font-family:Georgia,serif;font-size:26px;line-height:1;color:var(--vert)}
.moyen .score{color:var(--or)}
.faible .score{color:var(--brique)}
.score em{font-size:11px;font-style:normal;display:block;color:var(--encre-clair);
  font-family:inherit;margin-top:3px;letter-spacing:.02em}
.dom{font-size:12.5px;color:var(--encre-clair);margin:2px 0 9px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:11.5px;padding:3px 8px;border-radius:5px;background:var(--sable);color:var(--encre-clair)}
.tag.v{background:var(--vert-clair);color:#10553A}
.tag.r{background:var(--brique-clair);color:#8A2D14}
.pourquoi{font-size:13.5px;color:var(--encre-clair);margin-top:9px;
  border-top:1px dashed var(--sable-fonce);padding-top:9px}

/* ---------- detail ---------- */
.bloc{margin:0 0 22px}
.bloc h4{font-size:13px;margin:0 0 9px;color:var(--encre-clair);font-weight:600}
.jauge{height:7px;background:var(--sable);border-radius:4px;overflow:hidden;margin:6px 0 3px}
.jauge i{display:block;height:100%;background:var(--vert)}
.crit{margin-bottom:13px}
.crit .l{display:flex;justify-content:space-between;font-size:13.5px}
.etab{border:1px solid var(--sable-fonce);border-radius:var(--r);padding:12px 13px;margin-bottom:9px;background:#fff}
.etab .n{font-size:15px;margin-bottom:3px}
.etab .m{font-size:12.5px;color:var(--encre-clair)}
.liste{margin:0;padding-left:18px}
.liste li{margin-bottom:5px;font-size:14.5px}

/* ---------- passeport ---------- */
.passeport{background:#fff;border:1px solid var(--encre);border-radius:var(--r);padding:18px;margin-bottom:16px}
.passeport .ent{border-bottom:2px solid var(--encre);padding-bottom:10px;margin-bottom:14px}
.ligne{display:flex;justify-content:space-between;gap:14px;padding:7px 0;
  border-bottom:1px dotted var(--sable-fonce);font-size:14px}
.ligne b{font-weight:600;text-align:right}

/* ---------- ussd ---------- */
.ecran-ussd{background:#0C2A1A;color:#C6EBCF;font-family:ui-monospace,"Courier New",monospace;
  font-size:14px;line-height:1.7;padding:18px;border-radius:var(--r);white-space:pre-wrap;
  min-height:230px}
.ussd-in{display:flex;gap:8px;margin-top:12px}
.ussd-in input{flex:1}

.avert{font-size:12px;color:var(--encre-clair);background:var(--sable);padding:12px 14px;
  border-radius:var(--r);margin-top:8px}
.cache{display:none}
@media print{
  body{background:#fff}
  .bar,.prog,.etape,.noprint{display:none!important}
  .wrap{box-shadow:none;max-width:none}
}
@media (prefers-reduced-motion:no-preference){
  .ecran{animation:ap .22s ease-out}
  @keyframes ap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>

/* ---------- 4. Moteur de matching ---------- */

const PROFIL = {serie:"",moyenne:null,mention:"",region:"",interets:[],matieres:[],
  budget:"public",mobilite:"partout",distance:"non"};

function niveauDepuisMoyenne(m){
  if(m>=16) return "Très bien";
  if(m>=14) return "Bien";
  if(m>=12) return "Assez bien";
  return "Passable";
}

function evaluer(fil,p){
  // 1. Série : condition d'entrée
  let poidsSerie = 0;
  if(fil.p.includes(p.serie)) poidsSerie = 1;
  else if(fil.s.includes(p.serie)) poidsSerie = 0.62;
  else return null; // filière non ouverte à cette série

  const detail = {};
  detail.serie = Math.round(38*poidsSerie);

  // 2. Niveau académique face à l'exigence de la filière
  const ecart = p.moyenne - fil.ex;
  let n;
  if(ecart >= 3.5) n = 25 - Math.min(4,(ecart-3.5)*1.6);
  else if(ecart >= 3) n = 25;
  else if(ecart >= 0) n = 17.5 + ecart*2.5;
  else if(ecart >= -1) n = 12 + (ecart+1)*5.5;
  else if(ecart >= -2.5) n = 4 + (ecart+2.5)*5.3;
  else n = 1;
  detail.niveau = Math.round(Math.max(1,Math.min(25,n)));

  // 3. Centres d'intérêt
  const com = fil.inter.filter(i=>p.interets.includes(i)).length;
  detail.interet = Math.round(25*(0.62*(com/fil.inter.length) + 0.38*(com/Math.max(1,p.interets.length))));

  // 4. Matières fortes
  const cm = fil.mat.filter(m=>p.matieres.includes(m)).length;
  detail.matiere = p.matieres.length
    ? Math.round(10*(0.6*(cm/fil.mat.length) + 0.4*(cm/p.matieres.length))) : 4;

  // 5. Contexte : région, budget, enseignement à distance
  const etabs = fil.etabs.map(k=>({k,...E[k]}));
  const dansRegion = etabs.some(e=>e.r===p.region);
  const aDistance  = etabs.some(e=>e.t==="dist");
  const publics    = etabs.filter(e=>e.t!=="prive");
  let ctx = 0;
  if(dansRegion) ctx += 5;
  if(aDistance)  ctx += 3;
  if(p.budget==="public" && publics.length===0) ctx -= 16;
  if(p.mobilite==="region" && !dansRegion && !aDistance) ctx -= 17;
  if(p.distance==="oui" && aDistance) ctx += 4;
  detail.contexte = ctx;

  let total = detail.serie+detail.niveau+detail.interet+detail.matiere+detail.contexte;
  total = Math.max(0,Math.min(98,Math.round(total)));

  // Raisons lisibles
  const raisons = [];
  if(poidsSerie===1) raisons.push("Ta série "+p.serie+" est la voie principale vers cette filière.");
  else raisons.push("Ta série "+p.serie+" donne accès à cette filière, mais ce n'est pas la voie la plus directe.");
  if(ecart>=1) raisons.push("Ta moyenne de "+p.moyenne.toFixed(2)+" est confortable pour cette filière.");
  else if(ecart>=-0.5) raisons.push("Ta moyenne te place juste au niveau attendu — la sélection sera serrée.");
  else raisons.push("Cette filière demande souvent une moyenne autour de "+fil.ex+" : l'accès sera difficile.");
  if(com>0) raisons.push("Elle rejoint ce qui t'intéresse : "+
    fil.inter.filter(i=>p.interets.includes(i)).map(i=>INTERETS.find(x=>x.id===i).l.toLowerCase()).join(", ")+".");
  if(dansRegion) raisons.push("Elle se prépare dans ta région ("+p.region+").");
  else if(aDistance) raisons.push("Accessible à distance depuis ta région via l'UN-CHK.");
  else raisons.push("Elle demande de quitter ta région.");

  const alertes = [];
  if(p.budget==="public" && publics.length===0)
    alertes.push("Uniquement en établissement privé payant");
  if(p.mobilite==="region" && !dansRegion && !aDistance)
    alertes.push("Aucun établissement dans ta région");
  if(ecart < -1.5) alertes.push("Sélection très difficile avec ta moyenne");

  return {fil,total,detail,raisons,alertes,etabs,dansRegion,aDistance};
}

function classer(p){
  return FILIERES.map(f=>evaluer(f,p)).filter(Boolean)
    .sort((a,b)=> (b.total-a.total) || (b.fil.ex-a.fil.ex) || a.fil.nom.localeCompare(b.fil.nom,"fr"));
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function aller(e,push=true){ if(push && ecran!==e) historique.push(ecran); ecran=e; rendu(); window.scrollTo(0,0); }
btnRetour.onclick = ()=>{ ecran = historique.pop() || "accueil"; rendu(); window.scrollTo(0,0); };

function barreProgression(n){
  let h='<div class="prog">';
  for(let i=1;i<=4;i++) h+='<i class="'+(i<=n?"on":"")+'"></i>';
  return h+'</div><div class="etape">Étape '+n+' sur 4</div>';
}

function rendu(){
  btnRetour.classList.toggle("cache", ecran==="accueil");
  document.getElementById("etat").textContent =
    navigator.onLine ? "Connecté" : "Hors ligne · prêt";
  app.innerHTML = '<div class="ecran">'+ ({
    accueil:vAccueil, bac:vBac, matieres:vMatieres, interets:vInterets,
    situation:vSituation, resultats:vResultats, detail:vDetail,
    passeport:vPasseport, ussd:vUssd
  })[ecran]() +'</div>';
  brancher();
}

    <h2>${esc(r.fil.nom)}</h2>
    <small>${esc(r.fil.duree)} · moyenne indicative pour être compétitif : ${r.fil.ex}/20</small>

    <div class="bloc" style="margin-top:22px">
      <h4>Pourquoi ce score de ${r.total} sur 100</h4>
      ${crits.map(([l,v,m])=>`
        <div class="crit">
          <div class="l"><span>${esc(l)}</span><b>${v}/${m}</b></div>
          <div class="jauge"><i style="width:${Math.round(100*v/m)}%"></i></div>
        </div>`).join("")}
      ${r.detail.contexte!==0?`<div class="crit"><div class="l">
        <span>Ta région, ton budget, tes contraintes</span>
        <b>${r.detail.contexte>0?"+":""}${r.detail.contexte}</b></div></div>`:""}
    </div>

    <div class="bloc">
      <h4>Ce que cela veut dire pour toi</h4>
      <ul class="liste">${r.raisons.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    </div>

    <div class="bloc">
      <h4>Où travailler après</h4>
      <ul class="liste">${r.fil.deb.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>
    </div>

    <div class="bloc">
      <h4>Où préparer cette filière</h4>
      ${r.etabs.map(e=>`<div class="etab">
        <div class="n">${esc(e.n)}</div>
        <div class="m">${esc(e.r)} · ${e.t==="pub"?"Public":e.t==="dist"?"Public, à distance":"Privé agréé MESRI"} · ${esc(e.f)}</div>
      </div>`).join("")}
      <small style="margin-top:8px">Frais donnés à titre indicatif. À confirmer auprès de chaque établissement.</small>
    </div>

    <div class="duo noprint">
      <button class="btn sec" data-go="resultats">Retour à la liste</button>
      <button class="btn" id="choisir">Mettre dans mes vœux</button>
    </div>
  </div>`;
}

  const d = new Date().toLocaleDateString("fr-FR");

      <div class="ligne"><span>Région</span><b>${esc(PROFIL.region)}</b></div>

      <div class="ligne"><span>Centres d'intérêt</span><b>${PROFIL.interets.map(i=>INTERETS.find(x=>x.id===i).l).join(", ")}</b></div>

    <h3 style="margin:24px 0 10px">${voeux.length?"Mes vœux":"Mes 5 filières les mieux notées"}</h3>
    ${choisis.map((r,i)=>`

    <div class="avert">Ce passeport est un document d'aide à la décision.
    L'inscription officielle se fait sur Campusen.</div>
  </div>`;
}

/* --- Mode USSD --- */
let ussdEtape = 0, ussdProfil = {};
function ecranUssd(){
  const t = [
`*246# SUNU-ORIENT
Bienvenue.

1. Trouver ma filiere
2. Mes resultats
3. Aide

Repondre 1, 2 ou 3`,
`Ta serie du bac :

1. S1   2. S2
3. S3   4. STEG
5. L1   6. L2
7. Autre serie`,
`Ta moyenne au bac ?

Ecris-la sans virgule.
Exemple : 1245 pour 12,45`,
`Ce qui t'interesse
le plus :

1. Sante
2. Gestion, chiffres
3. Informatique
4. Droit
5. Agriculture
6. Enseigner`,
`Ta region :

1. Dakar  2. Thies
3. St-Louis 4. Diourbel
5. Kaolack 6. Ziguinchor
7. Autre`,
`Analyse en cours...

Tes 3 filieres :

1. ${ussdProfil.f1||"—"}
2. ${ussdProfil.f2||"—"}
3. ${ussdProfil.f3||"—"}

Un SMS avec le detail
et les etablissements
t'a ete envoye.

Repondre 0 pour finir`];
  return t[Math.min(ussdEtape,t.length-1)];
}
function vUssd(){
  return `<div class="pad">
    <h2>Sans internet, sans smartphone</h2>
    <small>Le même service au composeur du téléphone, sur n'importe quel appareil, y compris
    un téléphone à touches. Voici comment cela se présenterait.</small>
    <div class="ecran-ussd" style="margin-top:18px">${esc(ecranUssd())}</div>
    <div class="ussd-in">
      <input id="ussdIn" type="text" inputmode="numeric" placeholder="Ta réponse" aria-label="Réponse USSD">
      <button class="btn mini" id="ussdOk">Envoyer</button>
    </div>
    <div class="aide"><small>Ce canal demande une convention avec l'ARTP et les opérateurs
    (Orange, Free, Expresso) pour réserver le code court et rendre la session gratuite pour l'élève.</small></div>
    <div class="duo"><button class="btn sec" data-go="accueil">Retour à l'accueil</button></div>
  </div>`;
}

/* ---------- 6. Interactions ---------- */

function brancher(){
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>aller(b.dataset.go));

  const demo = document.getElementById("demo");
  if(demo) demo.onclick = ()=>{
    Object.assign(PROFIL,{serie:"STEG",moyenne:12.4,region:"Dakar",
      matieres:["compta","eco"],interets:["chiffre","commerce"],
      budget:"public",mobilite:"partout",distance:"non"});
    resultats = classer(PROFIL); voeux=[]; aller("resultats");
  };

  /* Étape 1 */
  const serie = document.getElementById("serie"), moy = document.getElementById("moy");
  if(serie){
    const maj = ()=>{
      const m = parseFloat(moy.value);
      const ok = serie.value && m>=8 && m<=20;
      document.getElementById("suite").disabled = !ok;
      document.getElementById("mention").textContent =
        (m>=8&&m<=20) ? "Mention estimée : "+niveauDepuisMoyenne(m) : "";
      if(ok){ PROFIL.serie=serie.value; PROFIL.moyenne=m; PROFIL.mention=niveauDepuisMoyenne(m); }
    };
    serie.onchange=maj; moy.oninput=maj; maj();
    document.getElementById("suite").onclick=()=>aller("matieres");
  }

  /* Étape 2 */
  const cm = document.getElementById("chipsM");
  if(cm){
    cm.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
      const id=c.dataset.m, on=PROFIL.matieres.includes(id);
      if(on) PROFIL.matieres=PROFIL.matieres.filter(x=>x!==id);
      else if(PROFIL.matieres.length<3) PROFIL.matieres.push(id);
      cm.querySelectorAll(".chip").forEach(x=>{
        const sel=PROFIL.matieres.includes(x.dataset.m);
        x.setAttribute("aria-pressed",sel);
        x.disabled = !sel && PROFIL.matieres.length>=3;
      });
    });
    cm.querySelectorAll(".chip").forEach(x=>{
      x.disabled = !PROFIL.matieres.includes(x.dataset.m) && PROFIL.matieres.length>=3;});
    document.getElementById("suite").onclick=()=>aller("interets");
  }

  /* Étape 3 */
  const ci = document.getElementById("chipsI");
  if(ci){
    const maj=()=>{document.getElementById("suite").disabled = PROFIL.interets.length<1;};
    ci.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
      const id=c.dataset.i, on=PROFIL.interets.includes(id);
      if(on) PROFIL.interets=PROFIL.interets.filter(x=>x!==id);
      else if(PROFIL.interets.length<4) PROFIL.interets.push(id);
      ci.querySelectorAll(".chip").forEach(x=>{
        const sel=PROFIL.interets.includes(x.dataset.i);
        x.setAttribute("aria-pressed",sel);
        x.disabled = !sel && PROFIL.interets.length>=4;
      });
      maj();
    });
    maj();
    document.getElementById("suite").onclick=()=>aller("situation");
  }

  /* Étape 4 */
  const reg = document.getElementById("region");
  if(reg){
    const maj=()=>{document.getElementById("suite").disabled = !PROFIL.region;};
    reg.onchange=()=>{PROFIL.region=reg.value;maj();};
    app.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{
      PROFIL.budget=b.dataset.b;
      app.querySelectorAll("[data-b]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.b===PROFIL.budget));});
    app.querySelectorAll("[data-mob]").forEach(b=>b.onclick=()=>{
      PROFIL.mobilite=b.dataset.mob;
      app.querySelectorAll("[data-mob]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.mob===PROFIL.mobilite));});
    app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
      PROFIL.distance=b.dataset.d;
      app.querySelectorAll("[data-d]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.d===PROFIL.distance));});
    maj();
    document.getElementById("suite").onclick=()=>{
      resultats = classer(PROFIL); voeux=[]; historique=["accueil"]; aller("resultats");
    };
  }

  /* Résultats */
  app.querySelectorAll("[data-fil]").forEach(b=>b.onclick=()=>{
    selection = resultats.find(r=>r.fil.id===b.dataset.fil); aller("detail");
  });

  /* Détail */
  const ch = document.getElementById("choisir");
  if(ch){
    const dedans = voeux.includes(selection.fil.id);
    ch.textContent = dedans ? "Retirer de mes vœux" : "Mettre dans mes vœux";
    ch.onclick=()=>{
      if(voeux.includes(selection.fil.id)) voeux=voeux.filter(v=>v!==selection.fil.id);
      else voeux.push(selection.fil.id);
      aller("passeport");
    };
  }

  const imp = document.getElementById("imprimer");
  if(imp) imp.onclick=()=>window.print();

  /* USSD */
  const uo = document.getElementById("ussdOk");
  if(uo){
    const env = ()=>{
      const v = document.getElementById("ussdIn").value.trim();
      if(!v) return;
      if(ussdEtape===0 && v!=="1"){ ussdEtape=0; }
      else if(ussdEtape===5 || v==="0"){ ussdEtape=0; ussdProfil={}; }
      else {
        if(ussdEtape===1) ussdProfil.serie = {1:"S1",2:"S2",3:"S3",4:"STEG",5:"L1",6:"L2"}[v]||"S2";
        if(ussdEtape===2) ussdProfil.moyenne = Math.min(20,Math.max(8,(parseInt(v,10)||1200)/100));
        if(ussdEtape===3) ussdProfil.inter = {1:"sante",2:"chiffre",3:"info",4:"droit",5:"agri",6:"ensei"}[v]||"chiffre";
        if(ussdEtape===4){
          ussdProfil.region = {1:"Dakar",2:"Thiès",3:"Saint-Louis",4:"Diourbel",5:"Kaolack",6:"Ziguinchor"}[v]||"Dakar";
          const p = {serie:ussdProfil.serie,moyenne:ussdProfil.moyenne,region:ussdProfil.region,
            interets:[ussdProfil.inter],matieres:[],budget:"public",mobilite:"partout",distance:"oui"};
          const res = classer(p);
          ussdProfil.f1 = res[0]?res[0].fil.nom.slice(0,26):"—";
          ussdProfil.f2 = res[1]?res[1].fil.nom.slice(0,26):"—";
          ussdProfil.f3 = res[2]?res[2].fil.nom.slice(0,26):"—";
        }
        ussdEtape++;
      }
      rendu();
      const n = document.getElementById("ussdIn"); if(n) n.focus();
    };
    uo.onclick = env;
    document.getElementById("ussdIn").onkeydown = e=>{ if(e.key==="Enter") env(); };
  }
}

window.addEventListener("online", ()=>{document.getElementById("etat").textContent="Connecté"});
window.addEventListener("offline",()=>{document.getElementById("etat").textContent="Hors ligne · prêt"});
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
rendu();
</script>
